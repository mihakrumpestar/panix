version: "3"

includes:
  bench:
    taskfile: ./tests/e2e
    flatten: true

vars:
  DEBUG_DIR: ./debug
  PROFILE_DIR: ./profile

  TEST_DIR: ./test
  COVER_PROFILE: "{{.TEST_DIR}}/cover.out"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Go

  go:run:
    desc: Run the application with go run
    cmds:
      - go run cmd/panix/main.go {{.CLI_ARGS}}

  go:run:race:
    desc: Run the application with go run + race check
    env:
      GORACE: log_path={{.DEBUG_DIR}}/race.log
    cmds:
      - mkdir -p {{.DEBUG_DIR}}
      - CGO_ENABLED=1 go run --race cmd/panix/main.go {{.CLI_ARGS}}

  go:run:profile:
    desc: Run the application with go run + all profiling enabled
    cmds:
      - rm -rf {{.PROFILE_DIR}}
      - mkdir -p {{.PROFILE_DIR}}
      - go run cmd/panix/main.go {{.CLI_ARGS}}
        --profile.cpu={{.PROFILE_DIR}}/cpu.prof
        --profile.mem={{.PROFILE_DIR}}/mem.prof
        --profile.block={{.PROFILE_DIR}}/block.prof
        --profile.mutex={{.PROFILE_DIR}}/mutex.prof
        --profile.goroutine={{.PROFILE_DIR}}/goroutine.prof

  go:build:
    desc: Build go binary
    cmds:
      - go build -o /dev/null ./...

  go:check:
    desc: Run checks
    cmds:
      - go mod tidy
      - golangci-lint run ./...
      - |
        if grep -rn "; " internal/ --include="*.go" | grep -v "for " | grep -v "//"; then
          echo "Error: Inlining pattern detected"
          exit 1
        fi
        echo "0 issues"
      #- govulncheck ./... # Disabled until we can upgrade go to 1.26.4

  go:test:
    desc: Run tests with coverage check and summary
    cmds:
      - mkdir -p {{.TEST_DIR}}
      - set -o pipefail && CGO_ENABLED=1 go test -race -shuffle=on ./...
        -coverprofile={{.COVER_PROFILE}} -covermode=atomic -coverpkg=./internal/...,./pkg/... -json
        | tee {{.TEST_DIR}}/test.json | tparse -trimpath
        "github.com/mihakrumpestar/panix"
      - go run github.com/vladopajic/go-test-coverage/v2@latest
        --profile={{.COVER_PROFILE}} --badge-file-name=gen/coverage.svg

  go:test:bench:
    desc: |
      Run benchmarks with comparison table (use CLI_ARGS for specific packages,
      e.g. task go:test:bench -- ./internal/pkg/tui/...)
      Flags: -benchtime=1s
    cmds:
      - go run ./tests/bench/ {{.CLI_ARGS}}

  go:profile:report:
    desc: |
      Report from e2e CPU and memory profiles (top 50 functions, self time)
      Usage: task go:profile:report [-- /path/to/profile/dir]
    vars:
      PROFILE_DIR: '{{.CLI_ARGS | default "./tests/e2e/profile"}}'
      SORT: '{{.SORT | default ""}}'
    cmds:
      - echo "=== CPU Profile (top 50) ==="
      - go tool pprof -text -nodecount=50 {{.SORT}} {{.PROFILE_DIR}}/cpu.prof
      - echo "=== Memory Profile (top 50, in-use space) ==="
      - go tool pprof -text -nodecount=50 {{.SORT}} -inuse_space {{.PROFILE_DIR}}/mem.prof
      - echo "=== Memory Profile (top 50, alloc space) ==="
      - go tool pprof -text -nodecount=50 {{.SORT}} -alloc_space {{.PROFILE_DIR}}/mem.prof

  go:profile:report:cum:
    desc: |
      Report from e2e CPU and memory profiles (top 50 functions, cumulative)
      Usage: task go:profile:report:cum [-- /path/to/profile/dir]
    cmds:
      - task: go:profile:report
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
          SORT: "-cum"

  go:test:e2e:
    desc: |
      Run e2e tests (requires KVM, QEMU, Nix)
      Flags (pass after --):
        --test=local|remote|both    Test scope (default: both)
        --phase=all|bootstrap|redeploy  Deploy phase (default: all)
        --panix-args="..."          Extra args passed to every panix deploy
                                    (e.g. --tags=homeConfigurations)
      Examples:
        task go:test:e2e -- --test=local
        task go:test:e2e -- --phase=redeploy --panix-args="--tags=homeConfigurations"
    cmds:
      - go run ./tests/e2e/ {{.CLI_ARGS}}

  go:test:e2e:build:
    desc: |
      Build all e2e Nix artifacts (installer ISO, kexec installer, cloud-init
      seeds, NixOS closures).
    cmds:
      - |
        set -euo pipefail
        FLAKE="path:./tests/e2e/testflakes"
        echo "Building all e2e test Nix artifacts..."
        nix build --no-link --print-out-paths \
          "$FLAKE#installer-iso" \
          "$FLAKE#kexec-installer" \
          "$FLAKE#debian-cloud-image" \
          "$FLAKE#seed-iso" \
          "$FLAKE#seed-remote-iso" \
          "$FLAKE#seed-nix-iso" \
          "$FLAKE#bake-seed-iso" \
          "$FLAKE#bake-seed-nix-iso" \
          "$FLAKE#nixosConfigurations.test-vm.config.system.build.toplevel" \
          "$FLAKE#nixosConfigurations.test-vm-remote.config.system.build.toplevel" \
          "$FLAKE#nixosConfigurations.test-vm-remote.config.system.build.diskoScript" \
          "$FLAKE#homeConfigurations.test-home.activationPackage"
        echo "All e2e test artifacts built."

  # Nix

  nix:run:
    desc: Run the application using nix
    cmds:
      - nix run path:$(pwd)#default --extra-experimental-features "nix-command
        flakes" -- {{.CLI_ARGS}}

  nix:build:
    desc: Build the package using nix
    cmds:
      - nix build .#default --extra-experimental-features "nix-command flakes"
      - ls -sh result/bin/panix

  nix:vendor:
    desc: Update vendor hash
    cmds:
      - nix-update --flake --version=skip default

  # General

  update:
    desc: Update all deps
    cmds:
      - devbox update
      - go get -u all
      - go mod tidy
      #- go mod vendor
      - nix flake update
      - nix flake update --flake ./tests/e2e/testflakes
      - task: nix:vendor

  ci:
    desc: Run all CI checks
    cmds:
      - task: generate
      - task: go:check
      - task: go:test
      - task: go:build
      #- go mod vendor

  generate:
    desc: Run go generate and update CLI/YAML sections in README and docs
    cmds:
      - go generate ./...
      - |
        HELP_OUTPUT="$(go run cmd/panix/main.go --help)"
        DEPLOY_HELP="$(go run cmd/panix/main.go deploy --help)"
        PANIX_YML="$(cat examples/panix.demo.yml)"

        # Helper: replace content between markers with a code block
        # Markers are outside code blocks. Content is wrapped in ```lang ... ```
        # Usage: replace_block FILE START_MARKER END_MARKER LANG NEW_CONTENT_FILE
        replace_block() {
          local file="$1" start="$2" end="$3" lang="$4" content_file="$5"
          awk -v start="$start" -v end="$end" -v lang="$lang" -v content_file="$content_file" 'BEGIN { while ((getline line < content_file) > 0) { new_content = new_content line "\n" } close(content_file) } $0 == start { print; printf "```%s\n", lang; printf "%s", new_content; printf "```\n"; skip=1; next } $0 == end { skip=0 } !skip { print }' "$file" 2>/dev/null > "${file}.tmp" && mv "${file}.tmp" "$file"
        }

        # Write temp files for content
        echo "$PANIX_YML" > /tmp/_panix_yml.txt
        printf '> panix --help\n%s' "$HELP_OUTPUT" > /tmp/_cli_help.txt
        printf '> panix deploy --help\n%s' "$DEPLOY_HELP" > /tmp/_deploy_help.txt

        # Update README.md panix.yml
        replace_block "README.md" "<!-- PANIX_YML_START -->" "<!-- PANIX_YML_END -->" yaml /tmp/_panix_yml.txt

        # Update docs CLI help
        replace_block "docs/src/content/docs/cli/index.mdx" "{/\* CLI_HELP_START \*/}" "{/\* CLI_HELP_END \*/}" sh /tmp/_cli_help.txt

        # Update docs deploy flags
        replace_block "docs/src/content/docs/cli/deploy.mdx" "{/\* DEPLOY_FLAGS_START \*/}" "{/\* DEPLOY_FLAGS_END \*/}" sh /tmp/_deploy_help.txt

        rm -f /tmp/_panix_yml.txt /tmp/_cli_help.txt /tmp/_deploy_help.txt

  release:
    desc: Create a new GitHub release
    vars:
      VERSION_FILE: gen/VERSION
    cmds:
      - |
        if [ -z "$GH_TOKEN" ]; then
          echo "Error: GH_TOKEN is not set"
          exit 1
        fi
      - |
        CURRENT=$(cat {{.VERSION_FILE}})
        SUGGESTED=$(git-cliff --bumped-version 2>/dev/null | sed 's/^v//' || echo "$CURRENT")
        echo "Current version: $CURRENT"
        echo "Suggested version: $SUGGESTED"
        VERSION_TMP=$(mktemp)
        echo "$SUGGESTED" > "$VERSION_TMP"
        ${EDITOR:-vi} "$VERSION_TMP"
        NEW_VERSION=$(cat "$VERSION_TMP" | tr -d '\n' | sed 's/^v//')
        rm "$VERSION_TMP"

        if [ -z "$NEW_VERSION" ]; then
          echo "Error: Version cannot be empty"
          exit 1
        fi

        if [ "$NEW_VERSION" != "$CURRENT" ]; then
          echo "$NEW_VERSION" > {{.VERSION_FILE}}

          go generate ./...
        fi

        git-cliff --unreleased --tag "v$NEW_VERSION" --prepend CHANGELOG.md
        git add -A
        git diff --cached --quiet || git commit -m "chore: bump version to $NEW_VERSION"

        git push
        git tag "v$NEW_VERSION"
        git push --tags

        NOTES_TMP=$(mktemp)
        git-cliff --tag "v$NEW_VERSION" --strip header > "$NOTES_TMP"
        echo "Generated release notes:"
        cat "$NOTES_TMP"
        echo ""
        echo "Edit release notes? (y/N)"
        read -r EDIT_NOTES
        if [ "$EDIT_NOTES" = "y" ] || [ "$EDIT_NOTES" = "Y" ]; then
          ${EDITOR:-vi} "$NOTES_TMP"
        fi
        gh release create "v$NEW_VERSION" --notes-file "$NOTES_TMP"
        rm -f "$NOTES_TMP"

  # Docs

  docs:bun:
    desc: Install deps
    dir: ./docs
    cmds:
      - bun install

  # Note: to update astro, run: npx @astrojs/upgrade
  docs:dev:
    desc: Run live dev docs
    dir: ./docs
    cmds:
      - bun dev

  docs:build:
    desc: Build docs static site
    dir: ./docs
    cmds:
      - bun run build

  docs:deploy:
    desc: Deploy docs to Cloudflare Pages (override branch with BRANCH=main)
    dir: ./docs
    deps:
      - docs:build
    vars:
      BRANCH: '{{.BRANCH | default ""}}'
    cmds:
      - bunx wrangler pages deploy --project-name panix {{if .BRANCH}}--branch {{.BRANCH}} {{end}}dist

  # Actions (local CI testing with act)

  actions:ci:
    desc: Run CI workflow locally with act
    cmds:
      - act push -W .github/workflows/ci.yml

  actions:docs:
    desc: Run docs-deploy workflow locally with act (secrets from keyring)
    cmds:
      - |
        act push -W .github/workflows/docs-deploy.yml \
          -s CLOUDFLARE_API_TOKEN="$(secret-tool lookup service cloudflare key api-token)" \
          -s CLOUDFLARE_ACCOUNT_ID="$(secret-tool lookup service cloudflare key account-id)"

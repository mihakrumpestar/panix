version: "3"

vars:
  BINARY_NAME: panix
  BUILD_DIR: ./build
  DIST_DIR: ./dist
  DEBUG_DIR: ./debug

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  run:
    desc: Run the application with go run
    cmds:
      - go generate ./...
      - go run cmd/panix/main.go {{.CLI_ARGS}}

  run:race:
    desc: Run the application with go run + race check
    env:
      GORACE: log_path={{.DEBUG_DIR}}/race.log
    cmds:
      - go run --race cmd/panix/main.go {{.CLI_ARGS}}

  run:profile:
    desc: Run the application with go run
    cmds:
      - go run cmd/panix/main.go --cpu-profile={{.DEBUG_DIR}}/profile.prof {{.CLI_ARGS}}

  profile-ui:
    cmds:
      # https://ksysoev.github.io/posts/go-cpu-profile/
      - go tool pprof -http=:8080 -no_browser {{.DEBUG_DIR}}/profile.prof

  nix:build:
    desc: Build the package using nix
    cmds:
      - nix build path:$(pwd)#default --extra-experimental-features "nix-command flakes"
      - ls -sh result/bin/panix

  nix:run:
    desc: Run the application using nix
    cmds:
      - nix run path:$(pwd)#default --extra-experimental-features "nix-command flakes" -- {{.CLI_ARGS}}

  nix:update:
    desc: Update flake
    cmds:
      - nix flake update

  nix:vendor:
   desc: Update vendor hash
   cmds:
    - nix-update --flake --version=skip default

  golangci:
    vars:
      CUSTOM_GCL: .devbox/bin/custom-gcl
    cmds:
      - if [ ! -f {{.CUSTOM_GCL}} ]; then golangci-lint custom --destination {{.CUSTOM_GCL}}; fi # Build linter
      - |
        {{.CUSTOM_GCL}} run {{.CLI_ARGS}} ./...
      - |
        if grep -rn "if err :=" internal/ --include="*.go"; then
          echo "Error: Found 'if err :=' pattern. Use 'err := ...' followed by 'if err != nil' instead."
          exit 1
        fi
        echo "0 issues"
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    desc: Create a new GitHub release
    vars:
      VERSION_FILE: gen/VERSION
    cmds:
      - |
        CURRENT=$(cat {{.VERSION_FILE}})
        SUGGESTED=$(git-cliff --bumped-version 2>/dev/null | sed 's/^v//' || echo "$CURRENT")
        echo "Current version: $CURRENT"
        echo "Suggested version: $SUGGESTED"
        VERSION_TMP=$(mktemp)
        echo "$SUGGESTED" > "$VERSION_TMP"
        ${EDITOR:-vi} "$VERSION_TMP"
        NEW_VERSION=$(cat "$VERSION_TMP" | tr -d '\n' | sed 's/^v//')
        rm "$VERSION_TMP"
        
        if [ -z "$NEW_VERSION" ]; then
          echo "Error: Version cannot be empty"
          exit 1
        fi
        
        if [ "$NEW_VERSION" != "$CURRENT" ]; then
          echo "$NEW_VERSION" > {{.VERSION_FILE}}

          go generate ./...
          git add -A
          git commit -m "chore: bump version to $NEW_VERSION"
        fi
        
        git push
        git tag "v$NEW_VERSION"
        git push --tags
        
        NOTES_TMP=$(mktemp)
        git-cliff --latest > "$NOTES_TMP"
        echo "Generated release notes:"
        cat "$NOTES_TMP"
        echo ""
        echo "Edit release notes? (y/N)"
        read -r EDIT_NOTES
        if [ "$EDIT_NOTES" = "y" ] || [ "$EDIT_NOTES" = "Y" ]; then
          ${EDITOR:-vi} "$NOTES_TMP"
        fi
        gh release create "v$NEW_VERSION" --notes-file "$NOTES_TMP"
        rm -f "$NOTES_TMP"
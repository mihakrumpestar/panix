version: "3"

vars:
  DEBUG_DIR: ./debug
  PROFILE_DIR: ./profile

  TEST_DIR: ./test
  COVER_PROFILE: "{{.TEST_DIR}}/cover.out"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Go

  go:run:
    desc: Run the application with go run
    cmds:
      - go run cmd/panix/main.go {{.CLI_ARGS}}

  go:run:race:
    desc: Run the application with go run + race check
    env:
      GORACE: log_path={{.DEBUG_DIR}}/race.log
    cmds:
      - mkdir -p {{.DEBUG_DIR}}
      - CGO_ENABLED=1 go run --race cmd/panix/main.go {{.CLI_ARGS}}

  go:run:profile:
    desc: Run the application with go run + all profiling enabled
    cmds:
      - rm -rf {{.PROFILE_DIR}}
      - mkdir -p {{.PROFILE_DIR}}
      - go run cmd/panix/main.go {{.CLI_ARGS}}
        --profile.cpu={{.PROFILE_DIR}}/cpu.prof
        --profile.mem={{.PROFILE_DIR}}/mem.prof
        --profile.block={{.PROFILE_DIR}}/block.prof
        --profile.mutex={{.PROFILE_DIR}}/mutex.prof
        --profile.goroutine={{.PROFILE_DIR}}/goroutine.prof

  go:build:
    desc: Build go binary
    cmds:
      - go build -o /dev/null ./...

  go:check:
    desc: Run checks
    cmds:
      - go mod tidy
      - golangci-lint run ./...
      - |
        if grep -rn "; " internal/ --include="*.go" | grep -v "for " | grep -v "//"; then
          echo "Error: Inlining pattern detected"
          exit 1
        fi
        echo "0 issues"
      - govulncheck ./...

  go:test:
    desc: Run tests with coverage check and summary
    cmds:
      - mkdir -p {{.TEST_DIR}}
      - set -o pipefail && CGO_ENABLED=1 go test -race -shuffle=on ./...
        -coverprofile={{.COVER_PROFILE}} -covermode=atomic -coverpkg=./... -json
        | tee {{.TEST_DIR}}/test.json | tparse -trimpath
        "github.com/mihakrumpestar/panix"
      - go run github.com/vladopajic/go-test-coverage/v2@latest
        --profile={{.COVER_PROFILE}} --badge-file-name=gen/coverage.svg

  go:test:bench:
    desc: |
      Run benchmarks with comparison table (use CLI_ARGS for specific packages,
      e.g. task go:test:bench -- ./internal/pkg/tui/...)
      Flags: -benchtime=1s
    cmds:
      - go run ./tests/bench/ {{.CLI_ARGS}}

  go:test:e2e:
    desc: |
      Run e2e tests (requires KVM, QEMU, Nix)
      Flags: -- --test=bothlocal|remote
    cmds:
      - go run ./tests/e2e/ {{.CLI_ARGS}}

  # Nix

  nix:run:
    desc: Run the application using nix
    cmds:
      - nix run path:$(pwd)#default --extra-experimental-features "nix-command
        flakes" -- {{.CLI_ARGS}}

  nix:build:
    desc: Build the package using nix
    cmds:
      - nix build .#default --extra-experimental-features "nix-command flakes"
      - ls -sh result/bin/panix

  update:
    desc: Update all deps
    cmds:
      - devbox update
      - go get -u all
      - go mod tidy
      #- go mod vendor
      - nix flake update

  ci:
    desc: Run all CI checks
    cmds:
      - task: generate
      - task: go:check
      - task: go:test
      - task: go:build
      #- go mod vendor

  generate:
    desc: Run go generate and update README CLI section
    cmds:
      - go generate ./...
      - |
        python3 - <<'EOF'
        import subprocess
        import re
        help_output = subprocess.run(['go', 'run', 'cmd/panix/main.go', '--help'], capture_output=True, text=True).stdout
        deploy_help = subprocess.run(['go', 'run', 'cmd/panix/main.go', 'deploy', '--help'], capture_output=True, text=True).stdout
        with open('README.md', 'r') as f:
            content = f.read()
        cli_section = f"\n### CLI\n\n```sh\n> panix --help\n{help_output}```\n\n<details>\n<summary>Deploy command flags</summary>\n\n```sh\n> panix deploy --help\n{deploy_help}```\n\n</details>\n"
        pattern = r'\n### CLI\n\n```sh\n.*?```\n\n<details>\n<summary>Deploy command flags</summary>\n\n```sh\n.*?```\n\n</details>\n'
        if not re.search(pattern, content, flags=re.DOTALL):
            pattern = r'\n### CLI\n\n```sh\n.*?```\n'
        content = re.sub(pattern, cli_section, content, flags=re.DOTALL)
        with open('examples/panix.demo.yml', 'r') as f:
            panix_yml = f.read()
        panix_yml_section = "```yaml\n" + panix_yml + "\n```\n"
        content = re.sub(
            r'(### 3\. Create panix\.yml\n\n).*?(\n### 4\.)',
            lambda m: m.group(1) + panix_yml_section + m.group(2),
            content,
            flags=re.DOTALL,
        )
        content = re.sub(
            r'(#### Minimal Example\n\n).*?(\n#### Full Example)',
            lambda m: m.group(1) + panix_yml_section + m.group(2),
            content,
            flags=re.DOTALL,
        )
        with open('README.md', 'w') as f:
            f.write(content)
        EOF

  release:
    desc: Create a new GitHub release
    vars:
      VERSION_FILE: gen/VERSION
    cmds:
      - |
        if [ -z "$GH_TOKEN" ]; then
          echo "Error: GH_TOKEN is not set"
          exit 1
        fi
      - |
        CURRENT=$(cat {{.VERSION_FILE}})
        SUGGESTED=$(git-cliff --bumped-version 2>/dev/null | sed 's/^v//' || echo "$CURRENT")
        echo "Current version: $CURRENT"
        echo "Suggested version: $SUGGESTED"
        VERSION_TMP=$(mktemp)
        echo "$SUGGESTED" > "$VERSION_TMP"
        ${EDITOR:-vi} "$VERSION_TMP"
        NEW_VERSION=$(cat "$VERSION_TMP" | tr -d '\n' | sed 's/^v//')
        rm "$VERSION_TMP"

        if [ -z "$NEW_VERSION" ]; then
          echo "Error: Version cannot be empty"
          exit 1
        fi

        if [ "$NEW_VERSION" != "$CURRENT" ]; then
          echo "$NEW_VERSION" > {{.VERSION_FILE}}

          go generate ./...
        fi

        git-cliff --tag "v$NEW_VERSION" -o CHANGELOG.md
        git add -A
        git diff --cached --quiet || git commit -m "chore: bump version to $NEW_VERSION"

        git push
        git tag "v$NEW_VERSION"
        git push --tags

        NOTES_TMP=$(mktemp)
        git-cliff --latest --strip header > "$NOTES_TMP"
        echo "Generated release notes:"
        cat "$NOTES_TMP"
        echo ""
        echo "Edit release notes? (y/N)"
        read -r EDIT_NOTES
        if [ "$EDIT_NOTES" = "y" ] || [ "$EDIT_NOTES" = "Y" ]; then
          ${EDITOR:-vi} "$NOTES_TMP"
        fi
        gh release create "v$NEW_VERSION" --notes-file "$NOTES_TMP"
        rm -f "$NOTES_TMP"

version: "3"

vars:
  BENCH_DIR: ./tests/e2e/bench-results
  COMMITS: '{{.COMMITS | default "5646a10cf8aae283c419ed26b55343ce89ea20c6 2988f71b8edc40b601aa4d0da2270ba311923182 e2b5802c0c15daae8ca249ffdbd2c208d7d05b30 808a7393f8dd130a5f99f367459f25e88210a5b4"}}'
  LABELS: '{{.LABELS | default "5646a10cf8aae283c419ed26b55343ce89ea20c6=basic caching,2988f71b8edc40b601aa4d0da2270ba311923182=optimized Bubble Tea components,e2b5802c0c15daae8ca249ffdbd2c208d7d05b30=initial zeroterm,808a7393f8dd130a5f99f367459f25e88210a5b4=final"}}'

tasks:
  bench:e2e:
    desc: |
      Run full e2e benchmark for all commits, then generate graphs and raw data table.
      Usage: task bench:e2e [COMMITS="sha1 sha2"] [LABELS="sha1=Label,sha2=Label"] [RUNS=5]
      Runs: RUNS times per commit (default 1). Multiple runs produce error bars.
      LABELS: comma-separated sha=label pairs.
    vars:
      RUNS: '{{.RUNS | default "1"}}'
    silent: true
    cmds:
      - |
        set -euo pipefail
        RUNS="{{.RUNS}}"
        BENCH_DIR="{{.BENCH_DIR}}"

        echo "=== E2E Benchmark: {{.RUNS}} run(s) per commit ==="
        echo ""

        rm -rf "$BENCH_DIR"
        mkdir -p "$BENCH_DIR"

        for run in $(seq 1 "$RUNS"); do
          echo ""
          echo "═══ Run $run/$RUNS ═══"
          for commit in {{.COMMITS}}; do
            task bench:e2e:run COMMIT="$commit" RUN_ID="$run"
          done
        done

        echo ""
        echo "═══ Generating graphs and data table ═══"
        python3 ./tests/e2e/bench_graph.py \
          --bench-dir "$BENCH_DIR" \
          --labels '{{.LABELS}}'

  bench:e2e:run:
    desc: |
      Build & run e2e for a specific commit.
      Usage: task bench:e2e:run COMMIT=SHA [RUN_ID=1]
    vars:
      COMMIT: "{{.COMMIT}}"
      RUN_ID: '{{.RUN_ID | default "1"}}'
      WORKTREE: /tmp/panix-bench-worktree
      BIN: /tmp/panix-bench-bin
    silent: true
    cmds:
      - |
        set -euo pipefail
        COMMIT="{{.COMMIT}}"
        RUN_ID="{{.RUN_ID}}"
        BENCH_DIR="{{.BENCH_DIR}}"
        if [ -z "$COMMIT" ]; then
          echo "ERROR: COMMIT is required"
          exit 1
        fi
        SHORT="${COMMIT:0:7}"
        echo "=== Benchmark: ${SHORT} (run ${RUN_ID}) ==="

        # Fetch commit from remote if not available locally (e.g. PR commits)
        if ! git cat-file -e "$COMMIT" 2>/dev/null; then
          echo "    Fetching $SHORT from origin..."
          git fetch origin "$COMMIT"
        fi

        if [ -d "{{.WORKTREE}}" ]; then
          git worktree remove --force "{{.WORKTREE}}" 2>/dev/null || true
        fi
        git worktree add "{{.WORKTREE}}" "$COMMIT"

        pushd "{{.WORKTREE}}" > /dev/null
        GOWORK=off nix build .#default --extra-experimental-features "nix-command flakes"
        rm -f "{{.BIN}}"
        cp result/bin/panix "{{.BIN}}"
        popd > /dev/null

        echo "    Built: $SHORT ($(sha256sum "{{.BIN}}" | cut -c1-12))"

        PANIX_BIN="{{.BIN}}" go run ./tests/e2e/ --test=both

        SAVE_DIR="$BENCH_DIR/run-$RUN_ID/$COMMIT"
        mkdir -p "$SAVE_DIR"
        cp tests/e2e/profile/*.prof "$SAVE_DIR/"
        ls -lh "$SAVE_DIR/"*.prof

        git worktree remove "{{.WORKTREE}}" 2>/dev/null || true
        rm -f "{{.BIN}}"
        echo "    Profiles saved to $BENCH_DIR/run-$RUN_ID/$SHORT/"

  bench:e2e:graph:
    desc: |
      Generate academic graphs and raw data table from benchmark results.
      Usage: task bench:e2e:graph [LABELS="sha=Label,..."]
    silent: true
    cmds:
      - |
        python3 ./tests/e2e/bench_graph.py \
          --bench-dir "{{.BENCH_DIR}}" \
          --labels '{{.LABELS}}'

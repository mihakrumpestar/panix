{{- $dir := env "PANIX_E2E_DIR" -}}
{{- $log := printf "%s/log" $dir -}}
{{- $profile := printf "%s/profile" $dir -}}
{{- $key := printf "%s/testflakes/ssh.key" $dir -}}
{{- $mode := env "PANIX_TEST_MODE" | default "bootstrap" -}}
{{- $scope := env "PANIX_TEST_SCOPE" | default "both" -}}
{{- $isBootstrap := eq $mode "bootstrap" -}}
{{- $isLocal := or (eq $scope "local") (eq $scope "both") -}}
{{- $isRemote := or (eq $scope "remote") (eq $scope "both") -}}

flags:
  timeout: 600s
  require_all_success: true
  local_machine_hostname: not-this-host
  snapshot:
    on_exit: true
    dir: {{ $log }}
{{ if $isBootstrap }}
  profile:
    cpu: {{ $profile }}/cpu.prof
    mem: {{ $profile }}/mem.prof
    block: {{ $profile }}/block.prof
    mutex: {{ $profile }}/mutex.prof
    goroutine: {{ $profile }}/goroutine.prof
{{ end }}

fleet:
  flakes:
    test:
      url: path:{{ env "PANIX_E2E_DIR" }}/testflakes
      nix:
        build_flags:
          - "--option"
          - "eval-cache"
          - "false"
          - "--offline"
      installables:
        nixosConfigurations:
{{ if $isLocal }}
          test-vm:
            machines:
              nixos-iso-vm:
                ssh: &ssh_nixos_iso
                  hostname: 127.0.0.1
                  port: 10022
                  username: root
                  identity_file: {{ $key }}
                  disable_strict_key_checking: true
{{ if $isBootstrap }}
                bootstrap:
                  ssh: *ssh_nixos_iso
                  post_bootstrap_provisioned_hooks:
                    - waitForOnline
{{ end }}
              kexec-vm:
                ssh: &ssh_kexec
                  hostname: 127.0.0.1
                  port: 10023
                  username: root
                  identity_file: {{ $key }}
                  disable_strict_key_checking: true
{{ if $isBootstrap }}
                bootstrap:
                  ssh: *ssh_kexec
                  kexec:
                    image: {{ env "PANIX_KEXEC_PATH" }}
                    ssh_port: 10023
                  post_bootstrap_provisioned_hooks:
                    - waitForOnline
{{ end }}
{{ end }}
{{ if $isRemote }}
          test-vm-remote:
            nix:
              build_mode: remote
              build_flags:
                - "--option"
                - "eval-cache"
                - "false"
                - "--offline"
            machines:
              nixos-iso-vm-remote:
                ssh: &ssh_nixos_iso_remote
                  hostname: 127.0.0.1
                  port: 10025
                  username: root
                  identity_file: {{ $key }}
                  disable_strict_key_checking: true
{{ if $isBootstrap }}
                bootstrap:
                  ssh: *ssh_nixos_iso_remote
                  post_bootstrap_provisioned_hooks:
                    - waitForOnline
{{ end }}
              kexec-vm-remote:
                ssh: &ssh_kexec_remote
                  hostname: 127.0.0.1
                  port: 10026
                  username: root
                  identity_file: {{ $key }}
                  disable_strict_key_checking: true
{{ if $isBootstrap }}
                bootstrap:
                  ssh: *ssh_kexec_remote
                  kexec:
                    image: {{ env "PANIX_KEXEC_PATH" }}
                    ssh_port: 10026
                  post_bootstrap_provisioned_hooks:
                    - waitForOnline
{{ end }}
{{ end }}
{{ if and $isLocal (not $isBootstrap) }}
        homeConfigurations:
          test-home:
            machines:
              nixos-iso-vm:
                ssh: *ssh_nixos_iso
              debian-nix-vm:
                ssh: &ssh_debian_nix
                  hostname: 127.0.0.1
                  port: 10027
                  username: root
                  identity_file: {{ $key }}
                  disable_strict_key_checking: true
          test-home-alice:
            user: alice
            machines:
              nixos-iso-vm:
                ssh: *ssh_nixos_iso
              debian-nix-vm:
                ssh: *ssh_debian_nix
{{ end }}

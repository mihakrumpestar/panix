$schema: "http://json-schema.org/draft-07/schema#"
$id: https://raw.githubusercontent.com/mihakrumpestar/panix/main/gen/panix-schema.yaml
version: 0.9.0
title: Panix Configuration Schema
description: Schema for Panix NixOS deployment configuration files
type: object
properties:
  flags:
    type: object
    description: Flags (CLI and YAML)
    properties:
      activation_mode:
        type: object
        description: "Activation mode override. Bare value (e.g. 'test') applies to all types. Per-type: 'nixosConfigurations=test;homeConfigurations=switch'"
        properties:
          alltypes:
            type: string
          pertype:
            type: object
            additionalProperties:
              type: string
        additionalProperties: false
      dry_run:
        type: boolean
        description: Show what would be done without executing
      dry_run_with_inspect:
        type: boolean
        description: Show what would be done without executing, but with real inspect query
      exit_on_complete:
        type: boolean
        description: Exit TUI on completion ('retry' and 'restart' are disabled in this mode)
      local_machine_hostname:
        type: string
        description: "Hostname of the machine that is local (won't use ssh to connect to it) (default: your deployment machine hostname)"
      logging:
        type: object
        properties:
          debug:
            type: boolean
            description: Debug mode (enables logging)
          log:
            type: boolean
            description: Enable logging to file
          log_file:
            type: string
            description: "Log file path (epoch timestamp appended before .log) (default: panix.log)"
            default: panix.log
            format: file-path
        additionalProperties: false
      output:
        type: string
        description: "Output mode: tui, console, json (default: tui)"
        default: tui
        enum:
        - tui
        - console
        - json
      profile:
        type: object
        properties:
          block:
            type: string
            description: Path for block profile output (enables block profiling)
            format: file-path
          cpu:
            type: string
            description: Path for CPU profile output (enables CPU profiling)
            format: file-path
          goroutine:
            type: string
            description: Path for goroutine profile output (enables goroutine profiling)
            format: file-path
          mem:
            type: string
            description: Path for memory profile output (enables memory profiling)
            format: file-path
          mutex:
            type: string
            description: Path for mutex profile output (enables mutex profiling)
            format: file-path
        additionalProperties: false
      require_all_success:
        type: boolean
        description: Abort if any task fails, primarily for CI/CD
      rollback_generation:
        type: integer
        description: "0=current generation, -N=Nth before current, N=specific generation (default: -1)"
        default: -1
      runtime:
        type: object
        properties:
          disconnect_timeout:
            type: string
            description: "Timeout for waiting for a host to disconnect during reboot (e.g. '5s', '10m') (default: 5m)"
            default: 5m
          flake_validation_timeout:
            type: string
            description: "Timeout for nix flake metadata/eval during validation (default: 60s)"
            default: 60s
          max_concurrency:
            type: integer
            description: "Maximum concurrent workers in the worker pool (default: 1000)"
            default: 1000
          reconnect_timeout:
            type: string
            description: "Timeout for waiting for a host to reconnect after reboot (e.g. '10s', '20m') (default: 10m)"
            default: 10m
          ssh_reachability_timeout:
            type: string
            description: "TCP dial timeout for SSH reachability probe (default: 2s)"
            default: 2s
        additionalProperties: false
      skip_phases:
        type: array
        description: Declare phases to skip (not all phases can be skipped)
        items:
          type: string
      snapshot:
        type: object
        properties:
          dir:
            type: string
            description: "Directory to save snapshots (default: .)"
            default: .
          on_exit:
            type: boolean
            description: Take snapshot on exit
          on_retry:
            type: boolean
            description: Take snapshot before retry
        additionalProperties: false
      tags:
        type: array
        description: Filter machines by tags (flakes, installables (output type and attribute name) and machine names are already registered as tags)
        items:
          type: string
      timeout:
        type: string
        description: "Timeout per command (eg. '1h', '1m15s') (default: 2h)"
        default: 2h
      tui:
        type: object
        properties:
          command_output_max_height:
            type: integer
            description: "Maximum height for command labels and outputs viewports in TUI (default: 8)"
            default: 8
          command_output_max_lines:
            type: integer
            description: "Maximum output lines to keep per command in TUI (older lines are trimmed from the front in batches) (default: 10000)"
            default: 10000
          show_active_only:
            type: boolean
            description: Show only running or errored logs in TUI build logs (keybind a)
          show_all_build_logs:
            type: boolean
            description: Show all build logs in TUI (keybind h)
          show_commands_in_labels:
            type: boolean
            description: Show raw commands instead of descriptions as labels in build logs (keybind c)
        additionalProperties: false
      validate:
        type: object
        description: Validator settings
        properties:
          bootstrap_secrets:
            type: boolean
            description: Validate that bootstrap disk encryption key local paths exist on disk
          flakes:
            type: boolean
            description: Validate flake URLs and configuration keys
        additionalProperties: false
    additionalProperties: false
  fleet:
    type: object
    description: Fleet configuration
    properties:
      bootstrap:
        description: Bootstrap configuration for initial provisioning
        $ref: "#/definitions/Bootstrap"
      disabled:
        type: boolean
        description: Disable this
      flakes:
        type: object
        description: Flakes in the fleet
        additionalProperties:
          type: object
          properties:
            bootstrap:
              description: Bootstrap configuration for initial provisioning
              $ref: "#/definitions/Bootstrap"
            disabled:
              type: boolean
              description: Disable this
            hardware_config_path:
              type: string
              description: Path to hardware config
            installables:
              type: object
              description: Installables (e.g. nixosConfigurations, homeConfigurations)
              additionalProperties:
                type: object
                additionalProperties:
                  type: object
                  properties:
                    activation_mode:
                      type: string
                      description: Activation mode (overrides preset default)
                    bootstrap:
                      description: Bootstrap configuration for initial provisioning
                      $ref: "#/definitions/Bootstrap"
                    disabled:
                      type: boolean
                      description: Disable this
                    hardware_config_path:
                      type: string
                      description: Path to hardware config
                    machines:
                      type: object
                      description: Machines configuration
                      additionalProperties:
                        anyOf:
                        - type: object
                          properties:
                            bootstrap:
                              description: Bootstrap configuration for initial provisioning
                              $ref: "#/definitions/Bootstrap"
                            disabled:
                              type: boolean
                              description: Disable this
                            hardware_config_path:
                              type: string
                              description: Path to hardware config
                            rsync_default_flags:
                              type: array
                              description: "List of base flags for rsync command (default: [-rcPEx, --mkpath])"
                              items:
                                type: string
                            secrets:
                              type: array
                              description: Files or directories to transfer to the remote machine
                              items:
                                $ref: "#/definitions/PlainFileOrDirToTransfer"
                            ssh:
                              description: SSH configuration for remote access
                              $ref: "#/definitions/SSHClient"
                            sudo_program:
                              type: string
                              description: "Override the sudo program (default: sudo)"
                              default: sudo
                            tags:
                              type: array
                              description: Tags for filtering (flakes, configs and machines are already registered as tags)
                              items:
                                type: string
                          additionalProperties: false
                        - type: "null"
                    nix:
                      description: Nix build and copy configuration
                      $ref: "#/definitions/NixConfig"
                    preset:
                      type: object
                      properties:
                        activation_default_mode:
                          type: string
                          description: Default activation mode
                        activation_path:
                          type: string
                          description: Activation script path in the closure
                        activation_supported_modes:
                          type: array
                          description: Activation modes
                          items:
                            type: string
                        build_path:
                          type: string
                          description: Build path within the flake output
                        is_bootstrappable:
                          type: boolean
                          description: Supports bootstrap
                        is_system_level:
                          type: boolean
                          description: System-level (root) vs user-level
                        profile_path:
                          type: string
                          description: Nix profile path
                        set_profile:
                          type: boolean
                          description: Run nix-env --profile --set before activation
                      additionalProperties: false
                    rsync_default_flags:
                      type: array
                      description: "List of base flags for rsync command (default: [-rcPEx, --mkpath])"
                      items:
                        type: string
                    secrets:
                      type: array
                      description: Files or directories to transfer to the remote machine
                      items:
                        $ref: "#/definitions/PlainFileOrDirToTransfer"
                    ssh:
                      description: SSH configuration for remote access
                      $ref: "#/definitions/SSHClient"
                    sudo_program:
                      type: string
                      description: "Override the sudo program (default: sudo)"
                      default: sudo
                    tags:
                      type: array
                      description: Tags for filtering (flakes, configs and machines are already registered as tags)
                      items:
                        type: string
                    user:
                      type: string
                      description: Target user for activation (user-level types only). When set, activation runs as this user via su -l. If empty, uses the SSH username.
                  required:
                  - machines
                  additionalProperties: false
            nix:
              description: Nix build and copy configuration
              $ref: "#/definitions/NixConfig"
            rsync_default_flags:
              type: array
              description: "List of base flags for rsync command (default: [-rcPEx, --mkpath])"
              items:
                type: string
            secrets:
              type: array
              description: Files or directories to transfer to the remote machine
              items:
                $ref: "#/definitions/PlainFileOrDirToTransfer"
            ssh:
              description: SSH configuration for remote access
              $ref: "#/definitions/SSHClient"
            sudo_program:
              type: string
              description: "Override the sudo program (default: sudo)"
              default: sudo
            tags:
              type: array
              description: Tags for filtering (flakes, configs and machines are already registered as tags)
              items:
                type: string
            url:
              type: string
              description: "Flake path (eg. './dir') or url (eg. 'path:...', 'ssh:...', 'github:...'), reference https://nix.dev/manual/nix/2.33/command-ref/new-cli/nix3-flake.html#url-like-syntax (default: .)"
              default: .
          required:
          - installables
          additionalProperties: false
      hardware_config_path:
        type: string
        description: Path to hardware config
      nix:
        description: Nix build and copy configuration
        $ref: "#/definitions/NixConfig"
      rsync_default_flags:
        type: array
        description: "List of base flags for rsync command (default: [-rcPEx, --mkpath])"
        items:
          type: string
      secrets:
        type: array
        description: Files or directories to transfer to the remote machine
        items:
          $ref: "#/definitions/PlainFileOrDirToTransfer"
      ssh:
        description: SSH configuration for remote access
        $ref: "#/definitions/SSHClient"
      sudo_program:
        type: string
        description: "Override the sudo program (default: sudo)"
        default: sudo
      tags:
        type: array
        description: Tags for filtering (flakes, configs and machines are already registered as tags)
        items:
          type: string
    required:
    - flakes
    additionalProperties: false
required:
- fleet
additionalProperties: true
definitions:
  Bootstrap:
    type: object
    properties:
      allow_destructive_actions:
        type: boolean
        description: Allow destructive bootstrap actions (required for force_bootstrap and force_bootstrap_kexec)
      disable_automatic_reboot:
        type: boolean
        description: Disable automatic reboot after nixos-install (useful for manual inspection or custom reboot handling)
      disable_disko:
        type: boolean
        description: Disables building, transfer and execution of disko tool
      disk_encryption_keys:
        type: array
        description: Keys are transferred to root dir on remote, which is the installer. If you want them to be transferred to disk of the final system, prefix path with '/mnt'
        items:
          $ref: "#/definitions/PlainFileOrDirToTransfer"
      force_bootstrap:
        type: boolean
        description: Force bootstrap even if machine is already NixOS (requires allow_destructive_actions)
      force_bootstrap_kexec:
        type: boolean
        description: Force kexec method even if already in NixOS installer (requires force_bootstrap and allow_destructive_actions)
      kexec:
        description: Kexec configuration for bootstrapping non-NixOS machines or reinstalling a live NixOS installation
        $ref: "#/definitions/KexecConfig"
      post_bootstrap_hooks:
        type: array
        description: Commands to run after disko partitioning
        items:
          type: string
      post_bootstrap_install_hooks:
        type: array
        description: Commands to run after nixos-install (before reboot)
        items:
          type: string
      post_bootstrap_provisioned_hooks:
        type: array
        description: Commands to run after reboot (uses regular SSH)
        items:
          type: string
      ssh:
        description: Bootstrap SSH configuration (used during initial provisioning)
        $ref: "#/definitions/SSHClient"
    additionalProperties: false
  KexecConfig:
    type: object
    properties:
      curl_default_flags:
        type: array
        description: "List of base flags for curl when downloading kexec tarball (default: [--fail, -#, -L, -C, -])"
        items:
          type: string
      extra_flags:
        type: array
        description: Extra flags to pass to kexec (e.g. '--no-sync')
        items:
          type: string
      image:
        type: string
        description: "URL or path to kexec tarball for bootstrapping non-NixOS machines (default: https://github.com/nix-community/nixos-images/releases/latest/download/nixos-kexec-installer-noninteractive-<arch>-linux.tar.gz)"
        default: https://github.com/nix-community/nixos-images/releases/latest/download/nixos-kexec-installer-noninteractive-<arch>-linux.tar.gz
      ssh_port:
        type: integer
        description: "SSH port for kexec installer (default: 22)"
        default: 22
    additionalProperties: false
  NixConfig:
    type: object
    properties:
      build_default_flags:
        type: array
        description: "List of base flags for 'nix build' command (default: [--no-link, --no-update-lock-file, --print-out-paths, --keep-going])"
        items:
          type: string
      build_env:
        type: object
        description: Environment variables for 'nix build' only (merged on top of env)
        additionalProperties:
          type: string
      build_flags:
        type: array
        description: List of extra flags for 'nix build' command (e.g. [--max-jobs, 4])
        items:
          type: string
      build_mode:
        type: string
        description: "Build mode: local or remote. In local mode, build runs on the local machine and the closure is copied to targets. In remote mode, build runs on the first target machine via --store ssh-ng://<target>. For single-machine installables, transfer is skipped (closure is already on target). For multi-machine installables, the closure is copied from the first machine to the rest. (default: local)"
        default: local
        enum:
        - local
        - remote
      copy_default_flags:
        type: array
        description: "List of base flags for 'nix copy' command (default: [--no-check-sigs])"
        items:
          type: string
      copy_env:
        type: object
        description: Environment variables for 'nix copy' only (merged on top of env)
        additionalProperties:
          type: string
      copy_flags:
        type: array
        description: List of extra flags for 'nix copy' command (e.g. [--compress])
        items:
          type: string
      env:
        type: object
        description: Environment variables applied to all nix commands (e.g. NIX_USER_CONF_FILES, NIX_STORE_DIR). Command-specific env fields override these.
        additionalProperties:
          type: string
      experimental_features:
        type: array
        description: "List of flags to enable nix experimental features (default: [--extra-experimental-features, nix-command flakes])"
        items:
          type: string
      extra_flags:
        type: array
        description: List of extra flags applied to both 'nix build' and 'nix copy'
        items:
          type: string
      nixos_install_default_flags:
        type: array
        description: "List of base flags for 'nixos-install' command (default: [--no-root-passwd, --no-channel-copy])"
        items:
          type: string
      nixos_install_env:
        type: object
        description: Environment variables for 'nixos-install' only (merged on top of env)
        additionalProperties:
          type: string
      nixos_install_flags:
        type: array
        description: List of extra flags for 'nixos-install' command (e.g. [--no-bootloader])
        items:
          type: string
      profile_install_default_flags:
        type: array
        description: "List of base flags for 'nix profile install' command (default: [])"
        items:
          type: string
      profile_install_env:
        type: object
        description: Environment variables for 'nix profile install' only (merged on top of env)
        additionalProperties:
          type: string
    additionalProperties: false
  PlainFileOrDirToTransfer:
    type: object
    properties:
      gid:
        type: integer
        description: Optional Group ID for remote
      local_path:
        type: string
        description: Path to a local file or dir
        format: file-path
      permissions:
        type: integer
        description: "File permissions (default: 0700)"
        default: 700
      remote_path:
        type: string
        description: Absolute path on remote machine
        pattern: ^/.*
        format: uri-reference
      uid:
        type: integer
        description: Optional User ID for remote
    required:
    - local_path
    - remote_path
    dependencies:
      gid:
      - uid
      uid:
      - gid
    additionalProperties: false
  SSHClient:
    type: object
    properties:
      disable_auto_add_host_key:
        type: boolean
        description: "Disable automatically adding host key to known_hosts on first connection (default: false)"
      disable_strict_key_checking:
        type: boolean
        description: "Disable strict host key checking (default: false)"
      extra_flags:
        type: array
        description: Extra flags passed to ssh (e.g. '-o', 'StrictHostKeyChecking=no')
        items:
          type: string
      hostname:
        type: string
        description: SSH hostname or IP address
      identity_file:
        type: string
        description: Path to SSH private key
        format: file-path
      known_hosts_file:
        type: string
        description: "Path to known_hosts file for SSH host key verification (default: user's ~/.ssh/known_hosts, bootstrap SSH uses a temporary file)"
        format: file-path
      port:
        type: integer
        description: "SSH port number (default: 22)"
        default: 22
      username:
        type: string
        description: "SSH username (default: root)"
        default: root
    additionalProperties: false

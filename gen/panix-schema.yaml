                          username:
                            type: string
                            description: SSH username
                        additionalProperties: false
                    additionalProperties: false
                  disabled:
                    type: boolean
                  flake_output:
                    type: string
                    description: "Option to override flake output if non-standard style (default: nixosConfigurations.<name>.config.system.build.toplevel)"
                  hardware_config_path:
                    type: string
                  machines:
                    type: object
                    additionalProperties:
                      anyOf:
                      - type: object
                        properties:
                          bootstrap:
                            type: object

$schema: "http://json-schema.org/draft-07/schema#"
$id: https://panix.dev/schema.json
version: 0.1.3
title: Panix Configuration Schema
description: Schema for Panix NixOS deployment configuration files
type: object
properties:
  flags:
    type: object
    properties:
      activation_mode:
        type: string
        description: "Activation mode: check, switch, boot, test, dry-activate (default: switch)"
        default: switch
        enum:
        - check
        - switch
        - boot
        - test
        - dry-activate
      bootstrap:
        type: object
        properties:
          disable_auto:
            type: boolean
            description: Disable automatic bootstrap (even if target machine does not have NixOS installed)
          disable_disko:
            type: boolean
            description: Disables building, transfer and bootstrap of disko tool
        additionalProperties: false
      config:
        type: string
        description: "Config file (default: panix.yml)"
        default: panix.yml
      dry_run:
        type: boolean
        description: Show what would be done without executing
      dry_run_with_inspect:
        type: boolean
        description: Show what would be done without executing, but with real inspect query
      exit_on_complete:
        type: boolean
        description: Exit TUI on completion; 'retry' and 'restart' are disabled in this mode
      logging:
        type: object
        properties:
          cpu_profile:
            type: string
            description: Path for cpu profiling to file, declaring it enables it
          debug:
            type: boolean
            description: Debug output (enables logging)
          log:
            type: boolean
            description: Enable logging to file
          log_file:
            type: string
            description: "Log file path (default: panix.log)"
            default: panix.log
        additionalProperties: false
      override_local_machine:
        type: string
        description: Hostname of the machine that is local (won't use ssh to connect to it)
      require_all_success:
        type: boolean
        description: Abort if any task fails, primarily for CI/CD
      skip_phases:
        type: array
        description: Declare phases to skip (not all phases can be skipped)
        items:
          type: string
      tags:
        type: array
        description: Filter machines by tags (flakes, configs and names are already registered as tags)
        items:
          type: string
      timeout:
        type: string
        description: "Timeout per command (eg. '1h', '1m15s') (default: 2h)"
        default: 2h
      tui:
        type: object
        properties:
          command_output_max_height:
            type: integer
            description: "Maximum height for command labels and outputs viewports in TUI (default: 8)"
            default: 8
          show_active_only:
            type: boolean
            description: Show only running or errored logs in TUI build logs (keybind a)
          show_all_build_logs:
            type: boolean
            description: Show all build logs in TUI (keybind h)
          show_commands_in_labels:
            type: boolean
            description: Show raw commands instead of descriptions as labels in build logs (keybind c)
        additionalProperties: false
    additionalProperties: false
  root:
    type: object
    properties:
      activation_mode:
        type: string
        description: "Activation mode: check, switch, boot, test, dry-activate (default: switch)"
        default: switch
        enum:
        - check
        - switch
        - boot
        - test
        - dry-activate
      bootstrap:
        type: object
        properties:
          allow_destructive_actions:
            type: boolean
            description: Allow destructive bootstrap actions (required for force_bootstrap and force_bootstrap_kexec)
          disable_automatic_reboot:
            type: boolean
            description: Disable automatic reboot after nixos-install (useful for manual inspection or custom reboot handling)
          disk_encryption_keys:
            type: array
            description: Keys are transferred to root dir on remote, which is the installer. If you want them to be transferred to disk of the final system, prefix path with '/mnt'
            items:
              type: object
              properties:
                gid:
                  type: integer
                  description: Optional Group ID for remote
                local_path:
                  type: string
                  description: Path to a local file or dir
                  format: file-path
                permissions:
                  type: integer
                  description: "Optional file permissions (default: 0700)"
                  default: "0700"
                remote_path:
                  type: string
                  description: Absolute path on remote machine
                  pattern: ^/.*
                  format: uri-reference
                uid:
                  type: integer
                  description: Optional User ID for remote
              required:
              - local_path
              - remote_path
              additionalProperties: false
          force_bootstrap:
            type: boolean
            description: Force bootstrap even if machine is already NixOS (requires allow_destructive_actions)
          force_bootstrap_kexec:
            type: boolean
            description: Force kexec method even if already in NixOS installer (requires force_bootstrap and allow_destructive_actions)
          kexec:
            type: object
            description: Kexec configuration for bootstrapping non-NixOS machines or reinstalling a live NixOS installation
            properties:
              extra_flags:
                type: string
                description: Extra flags to pass to kexec (e.g. '--no-sync')
              ssh_port:
                type: integer
                description: "SSH port for kexec installer (default: 22)"
              url:
                type: string
                description: URL or path to kexec tarball for bootstrapping non-NixOS machines
            additionalProperties: false
          post_bootstrap_hooks:
            type: array
            description: Commands to run after disko partitioning
            items:
              type: string
          post_bootstrap_install_hooks:
            type: array
            description: Commands to run after nixos-install (before reboot)
            items:
              type: string
          post_bootstrap_provisioned_hooks:
            type: array
            description: Commands to run after reboot (uses regular SSH)
            items:
              type: string
          ssh:
            type: object
            description: Bootstrap SSH configuration (used during initial provisioning)
            properties:
              disable_auto_add_host_key:
                type: boolean
                description: "Disable automatically adding host key to known_hosts on first connection (default: true for bootstrap SSH, false for regular SSH)"
              hostname:
                type: string
                description: SSH hostname or IP address
              identity_file:
                type: string
                description: Path to SSH private key
                format: file-path
              port:
                type: integer
                description: SSH port number
              strict_key_checking:
                type: boolean
                description: "Enable strict host key checking (default: false for bootstrap SSH, true for regular SSH)"
              username:
                type: string
                description: SSH username
            additionalProperties: false
        additionalProperties: false
      disabled:
        type: boolean
      flakes:
        type: object
        additionalProperties:
          type: object
          properties:
            activation_mode:
              type: string
              description: "Activation mode: check, switch, boot, test, dry-activate (default: switch)"
              default: switch
              enum:

$schema: "http://json-schema.org/draft-07/schema#"
$id: https://panix.dev/schema.json
version: 0.0.3
title: Panix Configuration Schema
description: Schema for Panix NixOS deployment configuration files
type: object
properties:
  flags:
    type: object
    properties:
      bootstrap:
        type: object
        properties:
          disable_auto:
            type: boolean
            description: Disable automatic bootstrap (even if target machine does not have NixOS installed)
          disable_disko:
            type: boolean
            description: Disables building, transfer and bootstrap of disko tool
          only:
            type: boolean
            description: Only initializes uninitialized machines
        additionalProperties: false
      config:
        type: string
        description: Config file
      dry_run:
        type: boolean
        description: Show what would be done without executing
      dry_run_with_inspect:
        type: boolean
        description: Show what would be done without executing, but with real inspect query
      exit_on_complete:
        type: boolean
        description: Exit TUI immediately when workflow completes (otherwise stays open until user quits); 'retry' and 'restart' do not work in this mode
      logging:
        type: object
        properties:
          cpu_profile:
            type: string
            description: Path for cpu profiling to file, declaring it enables it
          debug:
            type: boolean
            description: Debug output (enables logging)
          log:
            type: boolean
            description: Enable logging to file
          log_file:
            type: string
            description: Log file path
        additionalProperties: false
      override_local_machine:
        type: string
        description: Hostname of the machine that is local (won't use ssh to connect to it)
      require_all_success:
        type: boolean
        description: Abort if any task fails, primarily for CI/CD
      skip_phases:
        type: array
        description: Declare phases to skip (not all phases can be skipped)
        items:
          type: string
      tags:
        type: array
        description: Filter machines by tags (flakes, configurations and machine names are already registered as tags, children inherit all parent tags)
        items:
          type: string
      timeout:
        type: string
        description: Timeout for workflow (eg. '1h', '1m15s')
      tui:
        type: object
        properties:
          command_output_max_height:
            type: integer
            description: Maximum height for command labels and outputs viewports in TUI
          show_active_only:
            type: boolean
            description: Show only running or errored logs in TUI build logs (keybind a)
          show_all_build_logs:
            type: boolean
            description: Show all build logs in TUI (keybind h)
          show_commands_in_labels:
            type: boolean
            description: Show raw commands instead of descriptions as labels in build logs (keybind c)
        additionalProperties: false
    additionalProperties: false
  root:
    type: object
    properties:
      bootstrap:
        type: object
        properties:
          disable_automatic_reboot:
            type: boolean
            description: Disable automatic reboot after nixos-install (useful for manual inspection or custom reboot handling)
          disk_encryption_keys:
            type: array
            description: Keys are transfered to root dir on remote, which is the installer. If you want them to be transfered to disk of the final system, prefix path with '/mnt'
            items:
              type: object
              properties:
                gid:
                  type: integer
                  description: Optional Group ID for remote
                local_path:
                  type: string
                  description: Path to a local file or dir
                  format: file-path
                permissions:
                  type: integer
                  description: "Optional file permissions (default: 0700)"
                remote_path:
                  type: string
                  description: Absolute path on remote machine
                  pattern: ^/.*
                  format: uri-reference
                uid:
                  type: integer
                  description: Optional User ID for remote
              required:
              - local_path
              - remote_path
              additionalProperties: false
          kexec_extra_flags:
            type: string
            description: Extra flags to pass to kexec (e.g. '--no-sync')
          kexec_url:
            type: string
            description: URL or path to kexec tarball for bootstrapping non-NixOS machines
          post_bootstrap_hooks:
            type: array
            description: Commands to run after disko partitioning
            items:
              type: string
          post_bootstrap_install_hooks:
            type: array
            description: Commands to run after nixos-install (before reboot)
            items:
              type: string
          post_bootstrap_provisioned_hooks:
            type: array
            description: Commands to run after reboot (uses regular SSH)
            items:
              type: string
          ssh:
            type: object
            description: Bootstrap SSH configuration (used during initial provisioning)
            properties:
              disable_auto_add_host_key:
                type: boolean
                description: "Disable automatically adding host key to known_hosts on first connection (default: true for bootstrap SSH, false for regular SSH)"
              hostname:
                type: string
                description: SSH hostname or IP address
              identity_file:
                type: string
                description: Path to SSH private key
                format: file-path
              port:
                type: integer
                description: SSH port number
              strict_key_checking:
                type: boolean
                description: "Enable strict host key checking (default: false for bootstrap SSH, true for regular SSH)"
              username:
                type: string
                description: SSH username
            additionalProperties: false
        additionalProperties: false
      disabled:
        type: boolean
      flakes:
        type: object
        additionalProperties:
          type: object
          properties:
            bootstrap:
              type: object
              properties:
                disable_automatic_reboot:
                  type: boolean
                  description: Disable automatic reboot after nixos-install (useful for manual inspection or custom reboot handling)
                disk_encryption_keys:

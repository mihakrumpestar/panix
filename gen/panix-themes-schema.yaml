$schema: "http://json-schema.org/draft-07/schema#"
$id: https://raw.githubusercontent.com/mihakrumpestar/panix/main/gen/panix-themes-schema.yaml
version: 0.11.0
title: Panix Themes File Schema
description: Schema for Panix custom themes file panix-themes.yml
type: object
properties:
  themes:
    type: object
    description: Theme name to (partial) theme mapping
    additionalProperties:
      type: object
      properties:
        border:
          type: object
          description: Border drawing presets per widget region
          properties:
            notification:
              type: string
              description: Border preset
              enum:
                - ascii
                - blank
                - dashed
                - double
                - heavy
                - markdown
                - rounded
                - sharp
            overlay:
              type: string
              description: Border preset
              enum:
                - ascii
                - blank
                - dashed
                - double
                - heavy
                - markdown
                - rounded
                - sharp
            table:
              type: string
              description: Border preset
              enum:
                - ascii
                - blank
                - dashed
                - double
                - heavy
                - markdown
                - rounded
                - sharp
            viewport:
              type: string
              description: Border preset
              enum:
                - ascii
                - blank
                - dashed
                - double
                - heavy
                - markdown
                - rounded
                - sharp
          additionalProperties: false
        chars:
          type: object
          description: UI glyphs
          properties:
            error_icon:
              type: string
              description: Error icon
            header_separator:
              type: string
              description: Separator between header columns
            header_title_sep:
              type: string
              description: Separator between header title and value
            phase_arrow:
              type: string
              description: Arrow shown before phase names
            row_span_marker:
              type: string
              description: Marker for rows spanning multiple lines
            snapshot_icon:
              type: string
              description: Snapshot icon
          additionalProperties: false
        command:
          description: "Log entity: command"
          $ref: "#/definitions/ThemeLogEntity"
        error:
          description: "Log entity: error"
          $ref: "#/definitions/ThemeLogEntity"
        flake:
          description: "Log entity: flake"
          $ref: "#/definitions/ThemeLogEntity"
        footer:
          type: object
          description: Footer help line styling
          properties:
            help_desc:
              description: Help description styling
              $ref: "#/definitions/ThemeStyle"
            help_key:
              description: Help key styling
              $ref: "#/definitions/ThemeStyle"
            help_selected_desc:
              description: Selected help description styling
              $ref: "#/definitions/ThemeStyle"
            help_selected_key:
              description: Selected help key styling
              $ref: "#/definitions/ThemeStyle"
            help_separator:
              description: Help key/description separator styling
              $ref: "#/definitions/ThemeStyle"
            notification_base_style:
              description: Base styling for notifications
              $ref: "#/definitions/ThemeStyle"
          additionalProperties: false
        header:
          type: object
          description: Header title styling
          properties:
            title:
              description: Title styling
              $ref: "#/definitions/ThemeStyle"
          additionalProperties: false
        installable:
          description: "Log entity: installable"
          $ref: "#/definitions/ThemeLogEntity"
        machine:
          description: "Log entity: machine"
          $ref: "#/definitions/ThemeLogEntity"
        mode:
          type: string
          description: Terminal background the theme targets
          enum:
            - dark
            - light
        notification:
          type: object
          description: Notification styling
          properties:
            default_fg_color:
              type: string
              description: "Default notification foreground color: hex #RRGGBB or 0-255 palette index"
          additionalProperties: false
        output_type:
          description: "Log entity: output type"
          $ref: "#/definitions/ThemeLogEntity"
        phase:
          description: "Log entity: phase"
          $ref: "#/definitions/ThemeLogEntity"
        phase_status:
          type: object
          description: Phase status pill colors
          properties:
            default:
              type: array
              description: Gradient pair [from, to] for other phases
              items:
                type: string
              minItems: 2
              maxItems: 2
            done:
              type: array
              description: Gradient pair [from, to] for done phases
              items:
                type: string
              minItems: 2
              maxItems: 2
            failed:
              type: array
              description: Gradient pair [from, to] for failed phases
              items:
                type: string
              minItems: 2
              maxItems: 2
            pill:
              description: Phase status pill label styling
              $ref: "#/definitions/ThemeStyle"
            running:
              type: array
              description: Gradient pair [from, to] for running phases
              items:
                type: string
              minItems: 2
              maxItems: 2
          additionalProperties: false
        spinner:
          type: object
          description: Spinner frames and interval
          properties:
            frames:
              type: array
              description: Spinner frames cycled while running
              items:
                type: string
            interval:
              type: string
              description: "Frame interval: duration string like 120ms or integer nanoseconds"
          additionalProperties: false
        status:
          type: object
          description: Status colors and icons
          properties:
            failed:
              description: Failed/error styling
              $ref: "#/definitions/ThemeStyle"
            icons:
              type: object
              description: Status icons
              properties:
                failed:
                  type: string
                  description: Icon for failed status
                ok:
                  type: string
                  description: Icon for OK status
                running:
                  type: string
                  description: Icon for running status
              additionalProperties: false
            ok:
              description: OK/success styling
              $ref: "#/definitions/ThemeStyle"
            running:
              description: Running/info styling
              $ref: "#/definitions/ThemeStyle"
            warning:
              description: Warning styling
              $ref: "#/definitions/ThemeStyle"
          additionalProperties: false
        table:
          type: object
          description: Stats table and log list styling
          properties:
            border:
              description: Table border styling
              $ref: "#/definitions/ThemeStyle"
            row:
              description: Table row styling
              $ref: "#/definitions/ThemeStyle"
            selection_highlight_background:
              description: Selection highlight background
              $ref: "#/definitions/ThemeStyle"
            selection_highlight_border:
              description: Selection highlight border
              $ref: "#/definitions/ThemeStyle"
          additionalProperties: false
        tree:
          type: object
          description: Tree enumerator styling
          properties:
            branch:
              type: string
              description: Connector glyph before a non-last child (single cell)
            branch_last:
              type: string
              description: Connector glyph before the last child (single cell)
            enumerator:
              description: Tree enumerator (branch lines) styling
              $ref: "#/definitions/ThemeStyle"
            horizontal:
              type: string
              description: Horizontal run glyph inside the connectors (single cell)
            vertical:
              type: string
              description: Continuation glyph for a non-last parent (single cell)
          additionalProperties: false
      additionalProperties: false
additionalProperties: true
definitions:
  ThemeLogEntity:
    type: object
    properties:
      bold:
        type: boolean
        description: Bold text; unset inherits from the base theme
      color:
        type: string
        description: "Foreground color: hex #RRGGBB or 0-255 palette index"
      icon:
        type: string
        description: Icon glyph
    additionalProperties: false
  ThemeStyle:
    type: object
    properties:
      bg:
        type: string
        description: "Background color: hex #RRGGBB or 0-255 palette index"
      bold:
        type: boolean
        description: Bold text; unset inherits from the base theme
      fg:
        type: string
        description: "Foreground color: hex #RRGGBB or 0-255 palette index"
      pad_x:
        type: integer
        description: Horizontal padding; unset inherits from the base theme
      pad_y:
        type: integer
        description: Vertical padding; unset inherits from the base theme
    additionalProperties: false

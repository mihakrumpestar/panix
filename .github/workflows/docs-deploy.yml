name: Docs Deploy

on:
  push:
    branches: [main]
    paths: [docs/**, gen/VERSION]
  schedule:
    # Weekly rebuild so build-time GitHub star lookups
    # (docs/src/lib/fetch-repo-stars.ts) stay current.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write # cache-nix-action purges stale cache entries

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1" # Tool telemetry opt-out

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      # devenv (devenv.yaml + devenv.lock) is the single source of truth
      - uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://devenv.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=

      # Persist /nix across runs (see ci.yml for details).
      - uses: nix-community/cache-nix-action@v7
        if: ${{ env.ACT != 'true' }}
        with:
          primary-key: nix-${{ runner.os }}-docs-${{ hashFiles('devenv.yaml', 'devenv.lock', 'devenv.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-docs-
          gc-max-store-size-linux: 2G
          purge: ${{ github.ref == 'refs/heads/main' }}
          purge-prefixes: nix-${{ runner.os }}-docs-
          purge-created: 0
          purge-primary-key: never

      # devenv does not cover the bun package install cache, only bun itself.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install devenv.sh
        run: nix profile add nixpkgs#devenv

      # --profile docs: only the bun tool group (see devenv.nix)
      - run: devenv --profile docs shell -- task docs:bun

      - run: devenv --profile docs shell -- task docs:deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}

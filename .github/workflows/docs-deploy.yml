name: Docs Deploy

on:
  push:
    branches: [main]
    paths: [docs/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1" # For devbox

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Devbox (devbox.json + devbox.lock) is the single source of truth for
      # bun and go-task. The action caches the Nix store keyed on devbox.lock.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      # Devbox does not cover the bun package install cache, only bun itself.
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('docs/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: devbox run -- task docs:bun

      - run: devbox run -- task docs:deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}

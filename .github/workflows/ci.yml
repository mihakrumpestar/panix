name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "assets/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1" # For devbox

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # gitleaks scans the full history; the default depth 1 would see
          # only the pushed tip.
          fetch-depth: 0

      # Devbox (devbox.json + devbox.lock) is the single source of truth for
      # the toolchain: go, golangci-lint, tparse, go-task, gcc, gitleaks.
      # The action caches the Nix store keyed on devbox.lock.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          enable-cache: "true"

      # Go module and build caches are outside the devbox environment.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-

      - run: devbox run -- task ci

      # Fail if the CI tasks modified or created anything in the repo:
      # run 'task ci' locally and commit the results.
      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain -unormal)" ]; then
            echo "Error: repository changes detected:"
            git status -unormal
            exit 1
          fi

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Pushes every store path built by this job to the mihakrumpestar cache
      # (daemon mode: post-build hook feeds OUT_PATHS to the cachix daemon).
      # skipPush makes pushes explicitly disabled for fork PRs and secret-less
      # runs; signingKey is a no-op unless the self-managed keypair secret
      # exists (Cachix-managed signing works with authToken alone).
      - uses: cachix/cachix-action@v17
        with:
          name: mihakrumpestar
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          pushFilter: "(-source$|\\.drv$)"

      # Reuses the Nix installed above; devbox only contributes the tooling
      # pinned in devbox.lock (go-task) so 'task nix:build' runs exactly as it
      # does locally. Store caching is off here: the devbox store cache is
      # keyed to the devbox-installed Nix generation, and restoring it over
      # install-nix-action's live store/profile would clobber the cachix
      # binary and the live store DB; cachix + cache.nixos.org already
      # provide substitution for this job.
      - uses: jetify-com/devbox-install-action@v0.15.0
        with:
          skip-nix-installation: "true"
          enable-cache: "false"

      - run: devbox run -- task nix:build

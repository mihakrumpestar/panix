name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "assets/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-only: true

      - run: go install github.com/mfridman/tparse@v0.18.0

      - uses: go-task/setup-task@v2.2.0

      - run: task ci

      # Fail if the CI tasks modified or created anything in the repo:
      # run 'task ci' locally and commit the results.
      - name: Verify clean working tree
        run: |
          if [ -n "$(git status --porcelain -unormal)" ]; then
            echo "Error: repository changes detected:"
            git status -unormal
            exit 1
          fi

  nix-build:
    name: Nix Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Pushes every store path built by this job to the mihakrumpestar cache
      # (daemon mode: post-build hook feeds OUT_PATHS to the cachix daemon).
      # skipPush makes pushes explicitly disabled for fork PRs and secret-less
      # runs; signingKey is a no-op unless the self-managed keypair secret
      # exists (Cachix-managed signing works with authToken alone).
      - uses: cachix/cachix-action@v17
        with:
          name: mihakrumpestar
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          signingKey: "${{ secrets.CACHIX_SIGNING_KEY }}"
          skipPush: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}
          pushFilter: "(-source$|\\.drv$)"

      - uses: go-task/setup-task@v2.2.0

      - run: task nix:build

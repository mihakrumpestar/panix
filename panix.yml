# yaml-language-server: $schema=./gen/panix-schema.yaml

flags:
  timeout: 5500s
  override_local_machine: tmp
  

root:
  flakes:
    infrastructure:
      url: path:../infrastructure
      configurations:
        #server-03:
        #  machines:
        #    server-03:
        #      tags:
        #        - test
        #    docker-swarm:
        personal-workstation:
          machines:
            personal-workstation:
            fake:
              ssh:
                hostname: fake
                username: root
                port: 22

        personal-laptop:
          machines:
            personal-laptop:
              bootstrap:
                #ssh:
                #  hostname: 10.0.200.226
                #  identity_file: temp_key
                disk_encryption_keys:
                  - local_path: /tmp/disko-encryption-password.txt
                    remote_path: /tmp/disko-encryption-password.txt
                # Run after reboot manually, since FIDO2 key needs to get unlocked interactively
                # systemd-cryptenroll --fido2-device=auto --fido2-with-client-pin=no --fido2-with-user-presence=yes --wipe-slot=all /dev/nvme0n1p2

        server-01:
          machines:
            server-01:

        server-03:
          machines:
            server-03:
              bootstrap:
                disk_encryption_keys:
                  - local_path: /tmp/disko-encryption-password.txt
                    remote_path: /tmp/disko-encryption-password.txt
                post_bootstrap_hooks:
                  - systemd-cryptenroll --unlock-key-file=/tmp/disko-encryption-password.txt --tpm2-device=auto --tpm2-with-pin=no --wipe-slot=all /dev/sda2
                #ssh:
                #  hostname: 10.0.200.223
                #  username: root
                #  port: 22
                #  identity_file: temp_key

        vps-02:
          machines:
            vps-02:
        kiosk:
          machines:
            kiosk:
              ssh:
                hostname: 10.0.200.212
                #hostname: 10.0.60.2
                username: root
                port: 22222
                #identity_file: temp_key
              bootstrap:
                post_bootstrap_hooks:
                  - systemd-cryptenroll --tpm2-device=auto --tpm2-with-pin=no /dev/mmcblk1p2

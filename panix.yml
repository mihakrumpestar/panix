global:
  ssh_user: root
  ssh_timeout: 10
  concurrency: 5
  require_all_success: false
  auto_bootstrap: false
  dry_run: false

flakes:
  infrastructure:
    flakePath: ../infrastructure
    machines:
      personal-workstation:
        description: My personal NixOS workstation
        ssh:
          host: "local"
        #flakeOutput: personal-workstation
        tags:
          - workstation
          - personal
          - nixos
        transport: ssh

# yaml-language-server: $schema=./gen/panix-schema.yaml

# Below is not a comment, it is Golang template function definition
# {{define "cryptenroll"}}systemd-cryptenroll --unlock-key-file=/tmp/disko-encryption-password.txt --tpm2-device=auto --tpm2-with-pin=no --wipe-slot=all {{.}}{{end}}

bootstrap_defaults: &bootstrap_defaults
  kexec:
    url: ./kexec-<arch>.tar.gz
  disk_encryption_keys:
    - local_path: /tmp/disko-encryption-password.txt
      remote_path: /tmp/disko-encryption-password.txt

flags:
  timeout: 5500s
  override_local_machine: tmp

fleet:
  flakes:
    infrastructure:
      url: path:../infrastructure
      configurations:
        personal-workstation:
          machines:
            personal-workstation:
              bootstrap:
                <<: *bootstrap_defaults
                # Run after reboot manually, since FIDO2 key needs to get unlocked interactively
                # systemd-cryptenroll --fido2-device=auto --fido2-with-client-pin=no --fido2-with-user-presence=yes --wipe-slot=all /dev/nvme0n1p2

            fake:
              ssh:
                hostname: fake
                username: root
                port: 22

        personal-laptop:
          machines:
            personal-laptop:
              bootstrap:
                <<: *bootstrap_defaults
                # Run after reboot manually, since FIDO2 key needs to get unlocked interactively
                # systemd-cryptenroll --fido2-device=auto --fido2-with-client-pin=no --fido2-with-user-presence=yes --wipe-slot=all /dev/nvme0n1p2

        server-01:
          machines:
            server-01:
              bootstrap:
                <<: *bootstrap_defaults
                post_bootstrap_hooks:
                  - |
                    {{template "cryptenroll" "/dev/sda2"}}

        server-03:
          machines:
            server-03:
              bootstrap:
                <<: *bootstrap_defaults
                post_bootstrap_hooks:
                  - |
                    {{template "cryptenroll" "/dev/sda2"}}

        vps-02:
          machines:
            vps-02:

        kiosk:
          machines:
            kiosk:
              bootstrap:
                <<: *bootstrap_defaults
                post_bootstrap_hooks:
                  - |
                    {{template "cryptenroll" "/dev/mmcblk1p2"}}

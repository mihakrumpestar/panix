global:
  timeout: 7200 # 2h
  concurrency: 5
  requireAllSuccess: false
  autoBootstrap: false
  #dryRun: false

flakes:
  infrastructure:
    url: ../infrastructure
    configurations:
      personal-workstation:
        machines:
          default:
            ssh:
              alias: local
            tags:
              - workstation
              - personal
              - nixos
      server-03:
        machines:
          default:
            ssh:
              alias: server-03

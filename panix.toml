# inventory.toml
# Example inventory file for Panix

[global]
ssh_user = "root"
#ssh_private_key = "~/.ssh/id_ed25519"
ssh_timeout = 10
concurrency = 5
require_all_success = false
auto_bootstrap = false
dry_run = false
flake = "../infrastructure"


[[machines]]
name = "personal-workstation"
description = "My personal NixOS workstation"
ssh_alias = "local"
tags = ["workstation", "personal", "nixos"]


version: "2"

linters:
  default: all
  exclusions:
    warn-unused: true

  disable:
    - tagliatelle # Bad check
    - tagalign # Bad check
    - ireturn # A lot of bubbletea is based on interfaces
    - goconst # Just some same strings across codebase
    - gochecknoglobals # Constants are ok
    - exhaustruct # Structs are generally initialized empty
    - exhaustive # Not necessery as we use default
    - containedctx # We use ctx to check if it is done
    - testpackage # Don't want separate packages for testing
    - wsl # Replaced by wsl_v5
    - whitespace # Conflicts with wsl_v5
    - gomodguard # Replaced by gomodguard_v2
    - prealloc # Usually we don't preallocate slices

  enable:
    - gomodguard_v2

  settings:
    govet:
      enable:
        - shadow
        - atomicalign
        - deepequalerrors
        #- fieldalignment # struct with 24 pointer bytes could be 16
        - nilness
        - reflectvaluecompare
      settings:
        shadow:
          strict: true

    depguard:
      rules:
        main:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: errors
              desc: use github.com/pkg/errors instead

            - pkg: "charm.land/bubbles/v2"
              desc: "benchmark reference only and testing, not for production code"
            - pkg: "charm.land/bubbletea/v2"
              desc: "benchmark reference only and testing, not for production code"
            - pkg: "charm.land/lipgloss/v2"
              desc: "benchmark reference only and testing, not for production code"
            - pkg: "github.com/charmbracelet/ultraviolet"
              desc: "benchmark reference only and testing, not for production code"
            - pkg: "github.com/lrstanley/bubblezone/v2"
              desc: "benchmark reference only and testing, not for production code"

    forbidigo:
      forbid:
        - pattern: ^fmt\.Errorf$
          msg: use errors.Wrap or errors.Wrapf instead

    lll:
      line-length: 150

    varnamelen:
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-names:
        - ok
        - id
        - mu # mutex
        - wg # waitGroup
        - ch # channel
        - tt # table test case

    mnd:
      ignored-numbers:
        - "2"

    revive:
      rules:
        - name: exported
          disabled: true

    staticcheck:
      checks:
        - all
        - -QF1008 # could remove embedded field from selector
        - -ST1000 # at least one file in a package should have a package comment
        - -ST1003 # should not use underscores in package names
    #unused:
    #  field-writes-are-uses: false
    #  post-statements-are-reads: true
    #  exported-fields-are-used: false
    #  local-variables-are-used: false
    #  generated-is-used: false

    testifylint:
      enable-all: true
      bool-compare:
        ignore-custom-types: true
      expected-actual:
        pattern: ^expected

formatters:
  exclusions:
    warn-unused: true
    generated: strict

issues:
  max-issues-per-linter: 1000
  max-same-issues: 100
  fix: true
